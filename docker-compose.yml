

services:
  dokkee-backend:
    build:
      context: .
      args:
        - PORT=${PORT:-8000}
    container_name: dokkee-env-backend
    environment:
      - POSTGRES_HOST=dokkee-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - salt=${salt}
      - sign_key=${sign_key}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_USE_SSL=${S3_USE_SSL}
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      dokkee-postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
      dokkee-minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: always

  dokkee-postgres:
    image: postgres:18-alpine
    container_name: dokkee-postgres
    env_file: .env
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  postgres-migrate:
    image: migrate/migrate:v4.19.1
    command: ["-path", "/migrations", "-database", "$DATABASE_URL", "up"]
    volumes:
      - ./migrations:/migrations
    depends_on:
      dokkee-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dokkee:dokkee_secret@dokkee-postgres:5432/dokkee?sslmode=disable

  dokkee-minio:
    image: minio/minio:latest
    container_name: dokkee-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    expose:
      - "9000"
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  minio-init:
    image: minio/mc:latest
    depends_on:
      dokkee-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://dokkee-minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb --ignore-existing local/${S3_BUCKET};
      mc anonymous set download local/${S3_BUCKET};
      echo 'Bucket ${S3_BUCKET} ready';
      "

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: dokkee-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:dokkee-postgres:5432
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    profiles: ["dev"]

volumes:
  minio_data: